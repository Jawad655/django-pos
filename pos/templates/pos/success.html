<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Order Successful</title>


    <style>

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #f4f6f8;

            display: flex;

            justify-content: center;

            align-items: center;

            min-height: 100vh;

        }


        .success-box {

            background: white;

            width: 90%;

            max-width: 500px;

            padding: 35px;

            border-radius: 15px;

            text-align: center;

            box-shadow:
                0 5px 25px
                rgba(0,0,0,0.12);

        }


        .icon {

            font-size: 60px;

            margin-bottom: 10px;

        }


        h1 {

            margin: 5px 0 10px;

            color: #16a34a;

        }


        .order-info {

            background: #f8fafc;

            padding: 15px;

            border-radius: 10px;

            margin: 20px 0;

        }


        .order-info p {

            margin: 8px 0;

            font-size: 17px;

        }


        .buttons {

            display: grid;

            gap: 12px;

        }


        .btn {

            display: block;

            padding: 14px;

            border-radius: 8px;

            text-decoration: none;

            color: white;

            font-size: 17px;

            font-weight: bold;

        }


        .bill {

            background: #2563eb;

        }


        .kot {

            background: #dc2626;

        }


        .new-order {

            background: #16a34a;

        }


        .btn:hover {

            opacity: 0.9;

        }

    </style>

</head>


<body>


<div class="success-box">


    <div class="icon">

        ✅

    </div>


    <h1>

        Order Successful!

    </h1>


    <p>

        Your order has been saved successfully.

    </p>



    <div class="order-info">


        <p>

            <strong>
                Order #:
            </strong>

            {{ order.id }}

        </p>


        <p>

            <strong>
                Table:
            </strong>

            {% if order.table %}

                {{ order.table.number }}

            {% else %}

                Takeaway

            {% endif %}

        </p>


        <p>

            <strong>
                Total:
            </strong>

            Rs. {{ order.total }}

        </p>


    </div>



    <div class="buttons">


        <a
            class="btn bill"
            href="/bill/{{ order.id }}/"
        >

            View / Print Bill

        </a>


        <a
            class="btn kot"
            href="/kot/{{ order.id }}/"
        >

            View / Print KOT

        </a>


        <a
            class="btn new-order"
            href="/"
        >

            New Order

        </a>


    </div>


</div>


</body>

</html>
